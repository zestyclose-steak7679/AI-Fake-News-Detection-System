name: Full Training Verification
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: Fake-News-Detection

env:
  PYTHONPATH: ${{ github.workspace }}/Fake-News-Detection

jobs:
  train-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Fake-News-Detection/requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with: {path: ~/nltk_data, key: nltk-data-${{ runner.os }}}
      - run: python setup_nltk.py
      - name: Regenerate full pipeline
        run: |
          python src/data_loader.py
          python src/eda.py
          python src/preprocessing.py
          python src/feature_engineering.py
      - name: Verify pipeline
        run: python src/verify_pipeline.py
      - name: Train models
        run: python src/train.py
      - name: Evaluate models
        run: python src/evaluate.py
      - name: Verify training invariants
        run: |
          python -c "
          import pandas as pd, json
          manifest = json.load(open('models/vectorizers/manifest.json'))
          assert manifest['row_count'] > 40000
          assert manifest['vocabulary_size'] > 2000
          test_ids = pd.read_csv('splits/test_ids.csv')
          for name in ['LogReg','RandomForest','KNN','MLP']:
              for variant in ['baseline','tuned']:
                  df = pd.read_csv(f'outputs/predictions/{name}_{variant}.csv')
                  assert len(df) == len(test_ids), f'{name}_{variant} row mismatch'
                  assert df['predicted_label'].nunique() >= 2, f'{name}_{variant} collapsed to single class'
                  assert df['predicted_probability'].between(0,1).all(), f'{name}_{variant} bad probabilities'
          timing = json.load(open('outputs/metrics/timing.json'))
          for k,v in timing.items():
              assert v['train_time'] > 0 and v['predict_time'] > 0, f'{k} has zero time'
          print('ALL TRAINING INVARIANTS PASSED')
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-outputs
          path: |
            Fake-News-Detection/outputs/
            Fake-News-Detection/models/classifiers/
          retention-days: 14
