name: Phase 5 - Full Train & Verify

on:
  workflow_dispatch:  # Manual trigger only, since it's expensive

jobs:
  train_and_evaluate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python setup_nltk.py

    - name: Run Full Pipeline
      run: |
        export PYTHONPATH=.
        python src/data_loader.py
        python src/eda.py
        python src/preprocessing.py
        python src/feature_engineering.py
        python src/verify_pipeline.py

    - name: Train Models
      run: |
        export PYTHONPATH=.
        python src/train.py

    - name: Evaluate Models
      run: |
        export PYTHONPATH=.
        python src/evaluate.py

    - name: Fail if accuracies are collapsed
      run: |
        grep "LogReg_tuned" outputs/metrics/comparison_table.csv | awk -F',' '{if ($2 < 0.9) {print "LogReg failed accuracy threshold"; system("exit 1")}}'
        echo "Accuracies look healthy."

    - name: Upload Metrics
      uses: actions/upload-artifact@v3
      with:
        name: phase5-metrics
        path: outputs/metrics/
